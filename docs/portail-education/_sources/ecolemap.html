<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éducajou - ÉcoleMap</title>
    <link rel="stylesheet" href="style.css?version=50bef7784f5317f21af3d8ed6873f8a4fea99707">
    <script>
        var _paq = window._paq = window._paq || [];
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
            var u="https://wa.phm.education.gouv.fr/snp/";
            _paq.push(['setTrackerUrl', u+'matomo.php']);
            _paq.push(['setSiteId', '17']);
            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
        })();
    </script>
    <!-- End Matomo Code -->
  
</head>
<body>   


    <div id="haut">

        <a id="educajou" href="../"><img style="height: 100%;" src="images/educajou.png"></a>

        <div id="saisie">
                <input type="text" id="input-recherche" class="input-texte" placeholder="🔎 Nom, adresse ou commune">
                <input type="text" id="input-uai"  class="input-texte" placeholder="🔎 UAI (RNE)" maxlength="8">
        </div>
        
        <button id="bouton-fonds" onclick="changeFond()"></button>

        <div id="infos">
            <div class="section">
            Affichez un établissement scolaire sur fond Orthophoto IGN ou Openstreetmap.
            <br>
            Les données proviennent de <a href="https://data.education.gouv.fr/explore/dataset/fr-en-annuaire-education/table/?disjunctive.type_etablissement&disjunctive.code_postal&disjunctive.nom_commune&disjunctive.code_departement&disjunctive.appartenance_education_prioritaire&disjunctive.libelle_academie&disjunctive.libelle_region&disjunctive.ministere_tutelle">l'API data.education.gouv.fr</a>. <a href="https://forge.apps.education.fr/educajou/ecolemap#écolemap">Infos sur cette application</a></div>
        </div>    
        </div>


    </div>

    <div id="milieu">

        <div id="resultats-recherche" class="hide"></div>

        <div id="zonecarte">
           <iframe id="carte" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" sandbox="allow-forms allow-scripts allow-same-origin" allowfullscreen src="https://www.geoportail.gouv.fr/embed/visu.html?c=1.6207813872013777,47.201944857404385&z=6&l0=ORTHOIMAGERY.ORTHOPHOTOS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes"></iframe>

           <button id="photo" class="hide" onclick="creerImage()"></button>    
        </div>
    </div>

    <div id="bas"></div>
    
    <script src="dom.js"></script>
    <script src="dom-to-image-more.min.js"></script>
    <script src="script.js?version=50bef7784f5317f21af3d8ed6873f8a4fea99707"></script>
</body>
</html>
