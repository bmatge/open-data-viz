<div class="umami-bg-grey">
<div class="fr-container fr-pt-4w fr-pb-4w">
<section class="fr-pt-8v fr-pb-8v">
<div class="fr-grid-row">
<div class="fr-col-12 fr-pt-0">
<div>
<div class="fr-grid-row fr-grid-row--gutters">
<div class="fr-col-12">
<h1 class="fr-h1 fr-mb-4v fr-text--bold">Indices de position sociale des collèges de France pour l’année scolaire 2023-2024</h1>
</div>
</div>
</div>
</div>
</div>
</section>
</div>
</div>
<section class="fr-container fr-pt-8v fr-pb-8v">
<ods-dataset-context context="frenipslyceesdataviz" frenipslyceesdataviz-dataset="donnees-ips-colleges" frenipslyceesdataviz-sort="-rentree_scolaire">
<div class="row">
<div class="col-xs-2" ng-init="nbdepts=10;frenipslyceesdataviz.parameters['refine.rentree_scolaire']='2023-2024';">

<h4>
<span ng-show="!(frenipslyceesdataviz.parameters['refine.libelle_departement'] || frenipslyceesdataviz.parameters['refine.libelle_commune'])">
                        Sélectionnez un département ou une commune</span>
</h4>

<ods-facets context="frenipslyceesdataviz">

<h3 class="fr-h6 umami-color-glycine">Académie</h3>
<ods-facet name="libelle_academie" sort="alphanum"></ods-facet>
<h3 class="fr-h6 umami-color-glycine">Département</h3>
<div ods-adv-analysis="analysis_departement" ods-adv-analysis-context="frenipslyceesdataviz" ods-adv-analysis-group-by="libelle_departement" ods-adv-analysis-select="count(*) as tot">
<ul class="odswidget-facet__category-list liste-depts">
<div ng-repeat="analysis_departement_element in analysis_departement  | limitTo:nbdepts">
<li class="li-serre">
<a class="odswidget-facet__category" href="" ng-click="frenipslyceesdataviz.parameters['refine.libelle_departement'] = (frenipslyceesdataviz.parameters['refine.libelle_departement'] ? null : analysis_departement_element.libelle_departement )">{{analysis_departement_element.libelle_departement}}</a>
</li>
</div>
<a class="odswidget-facet__category" href="" ng-click="nbdepts=200" ng-show="analysis_departement.length &gt; 10 &amp;&amp;!frenipslyceesdataviz.parameters['refine.libelle_departement'] &amp;&amp; nbdepts==10">&gt; Plus</a>
<a class="odswidget-facet__category" href="" ng-click="nbdepts=10" ng-show="!frenipslyceesdataviz.parameters['refine.libelle_departement'] &amp;&amp; nbdepts==200">&gt; Moins</a>
</ul>
</div>
<h3 class="fr-h6 umami-color-glycine">Commune</h3>
<ods-facet name="libelle_commune" sort="alphanum"></ods-facet>
</ods-facets>

</div>
<div class="col-xs-10">


<ods-map location="5,47.35371,8.98682" ods-auto-resize="">
<ods-map-layer context="frenipslyceesdataviz" show-if="frenipslyceesdataviz.parameters['refine.libelle_departement'] || frenipslyceesdataviz.parameters['refine.libelle_commune']">
</ods-map-layer>
</ods-map>
</div>
</div>
<div class="row">
<a ng-href="{{frenipslyceesdataviz.getDownloadURL('csv')}}" target="_blank">Télécharger les données filtrées au format csv</a>
</div>
</ods-dataset-context>
</section>
