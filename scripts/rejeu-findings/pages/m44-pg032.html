<!doctype html>
<html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><title>PG-032 — dsfr-data-a11y et la grammaire champ:Libellé</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<style>dsfr-data-chart{display:block;max-width:760px}</style></head>
<body><main class="fr-container">
  <h1>PG-032 — dsfr-data-a11y accepte-t-il champ:Libellé ?</h1>
  <dsfr-data-source id="s" data='[
    {"dep":"Finistère","n":120,"m":7},{"dep":"Morbihan","n":80,"m":5},{"dep":"Ille-et-Vilaine","n":150,"m":9}]'></dsfr-data-source>
  <h2>0. le graphique apparié, qui accepte la grammaire</h2>
  <dsfr-data-chart id="g" source="s" type="bar" label-field="dep" value-field="n:Nombre d'équipements" value-fields="m:Nombre de piscines"></dsfr-data-chart>
  <h2>1. témoin : noms de colonnes nus</h2>
  <dsfr-data-a11y id="a1" for="g" source="s" table label-field="dep" value-field="n,m"></dsfr-data-a11y>
  <h2>2. grammaire du chart recopiée</h2>
  <dsfr-data-a11y id="a2" for="g" source="s" table label-field="dep:Département" value-field="n:Nombre d'équipements, m:Nombre de piscines"></dsfr-data-a11y>
  <h2>3. grammaire du chart sur value-field seulement</h2>
  <dsfr-data-a11y id="a3" for="g" source="s" table label-field="dep" value-field="n:Nombre d'équipements"></dsfr-data-a11y>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
