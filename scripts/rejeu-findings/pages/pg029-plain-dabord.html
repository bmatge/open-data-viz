<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>PG-029 — deux contextes sur un même select (plain-dabord)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>PG-029 — ordre « plain-dabord »</h1>
  <dsfr-data-source id="s-a" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-source id="s-b" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="insee-2020-geoapi-2023" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-context id="ctx-plain" sources="s-b">
    <dsfr-data-context-filter ui="sel" field="nom_region" apply-to="s-b"></dsfr-data-context-filter>
  </dsfr-data-context>
  <dsfr-data-context id="ctx-sync" sources="s-a" url-sync>
    <dsfr-data-context-filter ui="sel" field="reg_nom" apply-to="s-a"></dsfr-data-context-filter>
  </dsfr-data-context>
  <!-- L'option par defaut selectionnee est Normandie ; l'URL demandera Bretagne. -->
  <select class="fr-select" id="sel">
    <option value="Normandie" selected>Normandie</option>
    <option value="Bretagne">Bretagne</option>
  </select>
  <p>A (contexte synchronise, data-es) : <dsfr-data-kpi id="k-a" source="s-a" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
  <p>B (contexte non synchronise, insee) : <dsfr-data-kpi id="k-b" source="s-b" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
