<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-056 — une clé, deux noms de champ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-056 — un &lt;select&gt;, deux jeux, deux noms pour la même clé</h1>
  <!-- data-es nomme la région reg_nom ; insee-2020-geoapi-2023 la nomme nom_region.
       La voie native : un dsfr-data-context-filter par jeu, écoutant le même ui. -->
  <dsfr-data-source id="s-es" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-source id="s-insee" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="insee-2020-geoapi-2023" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-context id="ctx" sources="s-es s-insee">
    <dsfr-data-context-filter ui="sel" field="reg_nom" apply-to="s-es"></dsfr-data-context-filter>
    <dsfr-data-context-filter ui="sel" field="nom_region" apply-to="s-insee"></dsfr-data-context-filter>
  </dsfr-data-context>
  <select class="fr-select" id="sel">
    <option value="">France entière</option>
    <option value="Bretagne">Bretagne</option>
    <option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option>
  </select>
  <p>équipements : <dsfr-data-kpi id="k-es" source="s-es" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
  <p>communes : <dsfr-data-kpi id="k-insee" source="s-insee" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
  <dsfr-data-context-tags id="tags" for="ctx"></dsfr-data-context-tags>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
