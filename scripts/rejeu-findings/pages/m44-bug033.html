<!doctype html>
<html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><title>BUG-033 — color-map sur une courbe : trait et points</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<style>dsfr-data-chart{display:block;max-width:760px}</style></head>
<body><main class="fr-container">
  <h1>BUG-033 — color-map sur type="line" recolore-t-il les points ?</h1>
  <!-- Deux séries, deux couleurs absentes de la palette par défaut de DSFR Chart :
       #e1000f (225,0,15) et #00a95f (0,169,95). Tout pixel d'une autre couleur
       saturée vient de la palette par défaut. -->
  <dsfr-data-source id="s" data='[
    {"an":"2019","serie":"Alpha","v":10},{"an":"2020","serie":"Alpha","v":14},{"an":"2021","serie":"Alpha","v":12},{"an":"2022","serie":"Alpha","v":18},{"an":"2023","serie":"Alpha","v":16},
    {"an":"2019","serie":"Beta","v":4},{"an":"2020","serie":"Beta","v":6},{"an":"2021","serie":"Beta","v":5},{"an":"2022","serie":"Beta","v":9},{"an":"2023","serie":"Beta","v":7}]'></dsfr-data-source>
  <h2>A. color-map, sans databox</h2>
  <dsfr-data-chart id="a" source="s" type="line" label-field="an" value-field="v" series-field="serie"
    color-map="Alpha:#e1000f,Beta:#00a95f"></dsfr-data-chart>
  <h2>B. color-map, avec databox</h2>
  <dsfr-data-chart id="b" source="s" type="line" label-field="an" value-field="v" series-field="serie"
    color-map="Alpha:#e1000f,Beta:#00a95f" databox databox-title="Courbe témoin" databox-source="inline"></dsfr-data-chart>
  <h2>C. témoin sans color-map</h2>
  <dsfr-data-chart id="c" source="s" type="line" label-field="an" value-field="v" series-field="serie"></dsfr-data-chart>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
