<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-063 — échelle logarithmique</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-063 — distribution étalée de 1 à plusieurs milliers</h1>
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" group-by="reg_nom" select="count(*) as n" order-by="n:desc" max-records="30"></dsfr-data-source>
  <h2>1. échelle par défaut</h2>
  <dsfr-data-chart id="g1" source="s" type="bar" label-field="reg_nom" value-field="n" name="Équipements"></dsfr-data-chart>
  <h2>2. attributs d'échelle log essayés (log / y-scale / scale)</h2>
  <dsfr-data-chart id="g2" source="s" type="bar" label-field="reg_nom" value-field="n" name="Équipements"
    log y-scale="log" scale="log"></dsfr-data-chart>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
