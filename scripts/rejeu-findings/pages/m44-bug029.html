<!doctype html>
<html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><title>BUG-029 — une cellule sans observation vaut-elle 0 ?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<style>dsfr-data-chart{display:block;max-width:760px}</style></head>
<body><main class="fr-container">
  <h1>BUG-029 — une cellule sans observation vaut-elle 0 ?</h1>
  <!-- Format long : la série B n'a AUCUNE ligne en 2020 et 2021, la série A aucune en 2023.
       Attendu si corrigé : y = [[10,12,14,null],[null,null,7,9]]. -->
  <dsfr-data-source id="long" data='[
    {"an":"2020","serie":"A","v":10},{"an":"2021","serie":"A","v":12},{"an":"2022","serie":"A","v":14},
    {"an":"2022","serie":"B","v":7},{"an":"2023","serie":"B","v":9}]'></dsfr-data-source>
  <!-- Format large : b vaut null en 2020, la clé est absente en 2021. -->
  <dsfr-data-source id="large" data='[
    {"an":"2020","a":10,"b":null},{"an":"2021","a":12},{"an":"2022","a":14,"b":7},{"an":"2023","a":16,"b":9}]'></dsfr-data-source>
  <h2>1. barres, series-field (format long)</h2>
  <dsfr-data-chart id="g-long-bar" source="long" type="bar" label-field="an" value-field="v" series-field="serie"></dsfr-data-chart>
  <h2>2. courbe, series-field (format long)</h2>
  <dsfr-data-chart id="g-long-line" source="long" type="line" label-field="an" value-field="v" series-field="serie"></dsfr-data-chart>
  <h2>3. courbe, value-fields (format large, null et clé absente)</h2>
  <dsfr-data-chart id="g-large-line" source="large" type="line" label-field="an" value-field="a:Série A" value-fields="b:Série B"></dsfr-data-chart>
  <h2>4. barres, value-field seul (format large, null)</h2>
  <dsfr-data-chart id="g-large-bar" source="large" type="bar" label-field="an" value-field="b"></dsfr-data-chart>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
