<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>LIM-004 — répéteur imbriqué</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
</head>
<body>
  <main class="fr-container">
    <dsfr-data-source id="chap" data='[{"ch":"A","lib":"Chapitre A"},{"ch":"B","lib":"Chapitre B"}]'></dsfr-data-source>
    <dsfr-data-source id="quest" data='[{"ch":"A","code":"001","q":"Question 1"},{"ch":"A","code":"002","q":"Question 2"},{"ch":"B","code":"003","q":"Question 3"}]'></dsfr-data-source>
    <dsfr-data-display id="ext" source="chap" cols="1">
      <template>
        <section class="chapitre" data-ch="{{ch}}">
          <h2>{{lib}}</h2>
          <dsfr-data-query id="q-{{ch}}" source="quest" where="ch:eq:{{ch}}"></dsfr-data-query>
          <dsfr-data-display id="int-{{ch}}" source="q-{{ch}}" cols="1">
            <template><p class="question">[{{code}}|{{q}}]</p></template>
          </dsfr-data-display>
        </section>
      </template>
    </dsfr-data-display>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.29.1/dist/dsfr-data.esm.js"></script>
</body>
</html>
