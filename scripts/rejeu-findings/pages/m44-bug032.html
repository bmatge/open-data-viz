<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-032 : min/max sur un mois « 2024-09 »</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-032 — <code>min</code>/<code>max</code> d'une query sur « 2024-09 » et « 75A » ; <code>numeric</code> sur « 1922-1930 »</h1>
  <!-- Attendu juste : debut 2024-09, fin 2025-03. Défaut : 2024 et 2025.
       c (« 75A », « 92B ») : préfixe chiffré d'un code alphanumérique. Défaut : 75 et 92.
       Seconde porte du même parseur : numeric de normalize sur « 1922-1930 » et « 2008 : 2012 ». -->
  <dsfr-data-source id="s" data='[
    {"g":"A","m":"2024-09","c":"75A","p":"1922-1930"},
    {"g":"A","m":"2025-03","c":"92B","p":"2008 : 2012"},
    {"g":"B","m":"2024-11","c":"13C","p":"1950"}]'></dsfr-data-source>
  <dsfr-data-query id="q" source="s" aggregate="m:min:debut, m:max:fin, c:min:cmin, c:max:cmax"></dsfr-data-query>
  <dsfr-data-query id="qg" source="s" group-by="g" aggregate="m:min:debut, m:max:fin, c:min:cmin, c:max:cmax"></dsfr-data-query>
  <dsfr-data-normalize id="n" source="s" numeric="p"></dsfr-data-normalize>
  <dsfr-data-query id="qn" source="n" aggregate="p:min:pmin, p:max:pmax"></dsfr-data-query>
  <dsfr-data-query id="rn" source="n" where="g:isnotnull"></dsfr-data-query>
  <!-- numeric-prefix : attribut apparu avec le correctif (#1200), inconnu de la 0.42.0. -->
  <dsfr-data-normalize id="np" source="s" numeric-prefix="p"></dsfr-data-normalize>
  <dsfr-data-query id="rnp" source="np" where="g:isnotnull"></dsfr-data-query>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
