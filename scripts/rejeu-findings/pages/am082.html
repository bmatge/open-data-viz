<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-082 — series-field sur dsfr-data-a11y</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>AM-082 — le tableau equivalent connait-il la dimension serie ?</h1>
  <!-- Format long : une ligne par (departement x serie). Le graphique sait
       tracer trois series ; la demande etait que le tableau les pivote en colonnes. -->
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="dep_nom, inst_nom" where="reg_nom = 'Bretagne'"
    fetch-mode="export" max-records="20000"></dsfr-data-source>
  <dsfr-data-query id="q" source="s" group-by="dep_nom, inst_nom" aggregate="dep_nom:count"
    order-by="-dep_nom__count" limit="12"></dsfr-data-query>
  <h2>1. temoin : a11y sans series-field</h2>
  <dsfr-data-a11y id="a1" source="q" table label-field="dep_nom" value-field="dep_nom__count"></dsfr-data-a11y>
  <h2>2. series-field="inst_nom"</h2>
  <dsfr-data-a11y id="a2" source="q" table label-field="dep_nom" value-field="dep_nom__count"
    series-field="inst_nom"></dsfr-data-a11y>
  <h2>3. series-field seul (sans label-field/value-field) — doit avertir</h2>
  <dsfr-data-a11y id="a3" source="q" table series-field="inst_nom"></dsfr-data-a11y>
  <h2>4. les colonnes de valeur peuvent-elles porter un libelle, comme sur le chart ?</h2>
  <dsfr-data-a11y id="a4" source="q" table label-field="dep_nom:Departement"
    value-field="dep_nom__count:Nombre d'equipements"></dsfr-data-a11y>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.33.0/dist/dsfr-data.esm.js"></script>
</body></html>
