<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-023 : max/min de query sur dates ISO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-023 — <code>d:max</code> d'une query sur des dates ISO rend-il l'année ?</h1>
  <!-- Jeu du champ « verifie » de BUG-023. Attendu juste : A → 2026-09-25, B → 2026-08-10,
       global → 2026-09-25. Défaut : 2026 partout. Le KPI sert de témoin (il a une branche ISO). -->
  <dsfr-data-source id="s" data='[
    {"g":"A","d":"2026-09-01"},
    {"g":"A","d":"2026-09-25"},
    {"g":"B","d":"2026-08-10"}]'></dsfr-data-source>
  <dsfr-data-query id="qg" source="s" group-by="g" aggregate="d:max:dmax, d:min:dmin"></dsfr-data-query>
  <dsfr-data-query id="q" source="s" aggregate="d:max:dmax, d:min:dmin"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="s" value="d:max" format="date" label="KPI d:max (témoin)"></dsfr-data-kpi>
  <dsfr-data-kpi id="kq" source="q" value="dmax" format="date" label="KPI sur la query globale"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
