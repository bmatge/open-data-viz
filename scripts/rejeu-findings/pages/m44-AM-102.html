<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-102 — préréglages d'encart La Réunion et Wallis-et-Futuna</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<link rel="stylesheet" href="/assets/site.css"></head>
<body><main class="fr-container">
  <h1>AM-102 — les préréglages la-reunion et wallis-et-futuna montrent-ils leur territoire ?</h1>
  <!-- Encart de 10 rem (site.css, AM-032) × 160 px (défaut). Trois points : Saint-Pierre de
       La Réunion, Mata-Utu (Wallis), Leava (Futuna). Carte 1 : préréglages nus. Carte 2 :
       contournement du registre (zoom 8 ; centre -13.75,-177.15 zoom 6). -->
  <dsfr-data-source id="s" data='[
    {"nom":"Saint-Pierre","lat":-21.347,"lon":55.478},
    {"nom":"Mata-Utu","lat":-13.283,"lon":-176.174},
    {"nom":"Leava","lat":-14.293,"lon":-178.158},
    {"nom":"Paris","lat":48.85,"lon":2.35}]'></dsfr-data-source>
  <h2>1. Préréglages</h2>
  <dsfr-data-map id="m1" center="46.5,2.5" zoom="5" height="500px">
    <dsfr-data-map-layer source="s" type="circle" radius="6" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
    <dsfr-data-map-inset id="i-run" territory="la-reunion"></dsfr-data-map-inset>
    <dsfr-data-map-inset id="i-wf" territory="wallis-et-futuna"></dsfr-data-map-inset>
  </dsfr-data-map>
  <h2>2. Contournement : zoom et centre explicites</h2>
  <dsfr-data-map id="m2" center="46.5,2.5" zoom="5" height="500px">
    <dsfr-data-map-layer source="s" type="circle" radius="6" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
    <dsfr-data-map-inset id="j-run" territory="la-reunion" zoom="8"></dsfr-data-map-inset>
    <dsfr-data-map-inset id="j-wf" territory="wallis-et-futuna" center="-13.75,-177.15" zoom="6"></dsfr-data-map-inset>
  </dsfr-data-map>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
