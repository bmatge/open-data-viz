<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>PG-033 — tri serveur + pagination, lignes brutes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>PG-033 — tri serveur + pagination sur lignes brutes (API Tabular)</h1>
  <!-- 1 818 lignes (annee = 2025), 10 pages de 200, tri sur Code_region : champ NON unique.
       À l'API, hors de toute page (2026-10-03) : 1 818 lignes rendues, 1 718 __id distincts
       avec Code_region__sort=asc ; 1 818 / 1 818 sans tri. -->
  <dsfr-data-source id="s" api-type="tabular" base-url="https://tabular-api.data.gouv.fr" resource="2b27a675-e3bf-41ef-a852-5fb9ab483967"
    where="annee:eq:2025" order-by="Code_region:asc"></dsfr-data-source>
  <dsfr-data-kpi id="k" source="s" value="count" label="Lignes"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.44.0/dist/dsfr-data.esm.js"></script>
</body></html>
