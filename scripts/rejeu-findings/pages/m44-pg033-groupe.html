<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>PG-033 — tri serveur + pagination, chargement groupé</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>PG-033 — tri serveur + pagination sur un chargement GROUPÉ de plus de 200 groupes</h1>
  <!-- 101 départements × 18 indicateurs = 1 818 groupes, 10 pages, tri sur une clé de
       groupe non unique. À l'API (2026-10-03) : 1 818 lignes, 1 805 couples distincts
       avec Code_departement__sort=asc ; 1 818 / 1 818 sans tri. -->
  <dsfr-data-source id="s" api-type="tabular" base-url="https://tabular-api.data.gouv.fr" resource="2b27a675-e3bf-41ef-a852-5fb9ab483967"
    where="annee:eq:2025" group-by="Code_departement, indicateur" aggregate="nombre:sum"
    order-by="Code_departement:asc"></dsfr-data-source>
  <dsfr-data-kpi id="k" source="s" value="count" label="Groupes"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.44.0/dist/dsfr-data.esm.js"></script>
</body></html>
