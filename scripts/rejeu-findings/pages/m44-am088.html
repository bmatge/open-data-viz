<!doctype html>
<html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><title>AM-088 — le podium formate-t-il sa valeur et son sous-titre ?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<style>dsfr-data-chart{display:block;max-width:760px}</style></head>
<body><main class="fr-container">
  <h1>AM-088 — le podium formate-t-il sa valeur et son sous-titre ?</h1>
  <!-- Deux taux proches (9,98 et 10,41) et un troisième (7,25) ; nb = 5164, 937, 1. -->
  <dsfr-data-source id="s" data='[
    {"dep":"Seine-Saint-Denis","taux":10.41,"nb":5164},
    {"dep":"Nièvre","taux":9.98,"nb":937},
    {"dep":"Paris","taux":7.25,"nb":1}]'></dsfr-data-source>
  <h2>1. sans attribut de format</h2>
  <dsfr-data-podium id="p1" source="s" label-field="dep" value-field="taux" value-unit="%" subtitle-field="nb"></dsfr-data-podium>
  <h2>2. attributs plausibles de format (ceux du KPI et ceux que le constat demande)</h2>
  <dsfr-data-podium id="p2" source="s" label-field="dep" value-field="taux" value-unit="%" subtitle-field="nb"
    decimals="2" format="decimal" value-decimals="2" value-format="decimal" round="2"
    subtitle-format="number" subtitle-unit="aides" subtitle-template="{{nb:number}} aides"></dsfr-data-podium>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
