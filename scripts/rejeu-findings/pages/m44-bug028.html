<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-028 : agrégats d'un groupe entièrement nul</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-028 — <code>avg</code>, <code>sum</code>, <code>min</code>, <code>max</code> d'un groupe tout nul : 0 ou null ?</h1>
  <!-- Groupe a : mixte (10, null, 10) → moyenne 10 attendue. Groupe b : tout nul → null attendu,
       défaut = 0. La source « vide » ne porte que des nuls, pour l'agrégat global (cas Sitadel). -->
  <dsfr-data-source id="s" data='[
    {"g":"a","v":10},{"g":"a","v":null},{"g":"a","v":10},
    {"g":"b","v":null},{"g":"b","v":null}]'></dsfr-data-source>
  <dsfr-data-query id="qg" source="s" group-by="g" aggregate="v:avg:m, v:sum:s, v:min:mi, v:max:ma, v:count:c"></dsfr-data-query>
  <dsfr-data-source id="vide" data='[{"g":"b","v":null},{"g":"b","v":null}]'></dsfr-data-source>
  <dsfr-data-query id="q" source="vide" aggregate="v:avg:m, v:sum:s, v:min:mi, v:max:ma, v:count:c"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="q" value="s" label="Somme globale d'une colonne toute nulle"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
