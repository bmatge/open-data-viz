<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-107 — radius-field : rayon ou aire ?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>AM-107 — radius-field fait-il croître l'aire ou le rayon ?</h1>
  <!-- Trois valeurs : 1, 4, 100. Cercles honnêtes (aire proportionnelle) : rayons en
       rapport 1 : 2 : 10. Échelle affine du rayon entre radius-min 4 et radius-max 30 :
       4 ; 4,79 ; 30. Carte 2 : on essaie radius-scale="sqrt". Normalize : on essaie sqrt(). -->
  <dsfr-data-source id="s" data='[
    {"nom":"Paris","v":1,"lat":48.85,"lon":2.35},
    {"nom":"Lyon","v":4,"lat":45.76,"lon":4.83},
    {"nom":"Marseille","v":100,"lat":43.30,"lon":5.37}]'></dsfr-data-source>
  <h2>1. radius-field</h2>
  <dsfr-data-map id="m1" center="46.5,2.5" zoom="5" height="400px">
    <dsfr-data-map-layer id="l1" source="s" type="circle" radius-field="v" radius-min="4" radius-max="30" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
  </dsfr-data-map>
  <h2>2. radius-field + radius-scale="sqrt"</h2>
  <dsfr-data-map id="m2" center="46.5,2.5" zoom="5" height="400px">
    <dsfr-data-map-layer id="l2" source="s" type="circle" radius-field="v" radius-scale="sqrt" radius-min="4" radius-max="30" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
  </dsfr-data-map>
  <h2>3. compute avec sqrt()</h2>
  <dsfr-data-normalize id="n" source="s" compute="r = sqrt(v)"></dsfr-data-normalize>
  <dsfr-data-display id="d" source="n"><template><p class="ligne">{{nom}}:{{r}}</p></template></dsfr-data-display>
  <h2>4. témoin compute : abs()</h2>
  <dsfr-data-normalize id="n2" source="s" compute="r = abs(v)"></dsfr-data-normalize>
  <dsfr-data-display id="d2" source="n2"><template><p class="ligne">{{nom}}:{{r}}</p></template></dsfr-data-display>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
