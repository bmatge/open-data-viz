<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-103 / AM-090 — compute : sous-chaîne et quote échappée</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-103 / AM-090 — <code>compute</code> : sous-chaîne et quote échappée</h1>
  <!-- Données locales, aucune requête. Un normalize par expression : une erreur de
       compilation n'en masque pas une autre. n0 est le témoin : si lui ne calcule pas,
       c'est la page qui est fausse. -->
  <dsfr-data-source id="s" data='[
    {"siret":"12345678901234","code":"75056","l":"J&#39;en ai"},
    {"siret":"98765432100011","code":"01004","l":"Je n&#39;en ai pas"}]'></dsfr-data-source>
  <dsfr-data-normalize id="n0" source="s" compute="x = len(siret)"></dsfr-data-normalize>
  <dsfr-data-normalize id="n1" source="s" compute="x = left(siret, 9)"></dsfr-data-normalize>
  <dsfr-data-normalize id="n2" source="s" compute="x = substr(code, 1, 2)"></dsfr-data-normalize>
  <dsfr-data-normalize id="n3" source="s" compute="x = when l = 'J''en ai' then 1 else 0"></dsfr-data-normalize>
  <dsfr-data-normalize id="n4" source="s" compute="x = when l = 'J\'en ai' then 1 else 0"></dsfr-data-normalize>
  <dsfr-data-normalize id="n5" source="s" compute="x = when contains(l, 'en ai') then 1 else 0"></dsfr-data-normalize>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.44.0/dist/dsfr-data.esm.js"></script>
</body></html>
