<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-084 — valeur par defaut d'une facette</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-084 — une facette peut-elle porter une valeur par defaut ?</h1>
  <!-- Le cas du Barometre : « Toutes regions » est une LIGNE du jeu, pas une
       absence de filtre. Sans defaut, le total porte sur le cumul (national +
       une ligne par region) sans avertissement.
       Source agregee cote serveur : une ligne par region, donc aucune troncature. -->
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" group-by="reg_nom" select="reg_nom, count(*) as n"
    order-by="-n" max-records="100"></dsfr-data-source>
  <h2>1. temoin : aucune selection au montage</h2>
  <dsfr-data-facets id="f1" source="s" fields="reg_nom" max-values="30"></dsfr-data-facets>
  <h2>2. default="reg_nom:Bretagne" (valeur presente)</h2>
  <dsfr-data-facets id="f2" source="s" fields="reg_nom" default="reg_nom:Bretagne" max-values="30"></dsfr-data-facets>
  <h2>3. default sur une valeur absente du jeu</h2>
  <dsfr-data-facets id="f3" source="s" fields="reg_nom" default="reg_nom:Pays imaginaire" max-values="30"></dsfr-data-facets>
  <h2>4. default + select : l'option « Tous » doit disparaitre</h2>
  <dsfr-data-facets id="f4" source="s" fields="reg_nom" display="reg_nom:select"
    default="reg_nom:Bretagne" max-values="30"></dsfr-data-facets>
  <h2>5. temoin select sans defaut</h2>
  <dsfr-data-facets id="f5" source="s" fields="reg_nom" display="reg_nom:select" max-values="30"></dsfr-data-facets>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.33.0/dist/dsfr-data.esm.js"></script>
</body></html>
