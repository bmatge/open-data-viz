<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>PG-034 — in à parenthèse posé sur une query</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>PG-034 — <code>in</code> avec une valeur à parenthèse, posé sur une dsfr-data-query</h1>
  <!-- Attendu juste : 202 lignes (101 départements × 2 indicateurs, année 2025).
       À l'API : indicateur__in=Homicides,Usage de stupéfiants (AFD) → 101. -->
  <dsfr-data-source id="s" api-type="tabular" base-url="https://tabular-api.data.gouv.fr" resource="2b27a675-e3bf-41ef-a852-5fb9ab483967" where="annee:eq:2025"></dsfr-data-source>
  <dsfr-data-query id="q" source="s" where="indicateur:in:Homicides|Usage de stupéfiants (AFD)"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="q" value="count" label="Lignes"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.44.0/dist/dsfr-data.esm.js"></script>
</body></html>
