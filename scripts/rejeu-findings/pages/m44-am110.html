<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — AM-110 : share_percent sans partition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-110 — <code>share_percent</code> se calcule-t-il par groupe ?</h1>
  <!-- Deux années, deux réponses. Part « parmi les répondants de l'année » attendue :
       2014 → oui 25, non 75 ; 2021 → oui 60, non 40 (somme 100 par année).
       Sans partition : dénominateur 100+500 = 600 → 4,17 / 12,5 / 50 / 33,33 (somme 100 au total).
       q2 et q3 essaient les noms plausibles d'un attribut de partition. -->
  <dsfr-data-source id="s" data='[
    {"annee":"2014","reponse":"oui","n":25},
    {"annee":"2014","reponse":"non","n":75},
    {"annee":"2021","reponse":"oui","n":300},
    {"annee":"2021","reponse":"non","n":200}]'></dsfr-data-source>
  <dsfr-data-query id="q1" source="s" group-by="annee, reponse" aggregate="n:sum:n, n:share_percent:part"></dsfr-data-query>
  <dsfr-data-query id="q2" source="s" group-by="annee, reponse" aggregate="n:sum:n, n:share_percent:part"
    share-by="annee" partition-by="annee" share-partition="annee"></dsfr-data-query>
  <dsfr-data-query id="q3" source="s" group-by="annee, reponse" aggregate="n:sum:n, n:share_percent:part:annee"></dsfr-data-query>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
