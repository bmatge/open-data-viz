<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>#71 — median() ODSQL dans le select</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <!-- Sans group_by, ODS répète l'agrégat sur chaque ligne de page : limit="1" (piège du dépôt). -->
  <h1>#71 — median() ODSQL passe-t-il tel quel, avec et sans group_by ?</h1>
  <dsfr-data-source id="s1" api-type="opendatasoft" base-url="https://data.education.gouv.fr"
    dataset-id="donnees-ips-ecoles" select="median(ips) as med, count(ips) as n"
    where="rentree_scolaire = '2024-2025'" limit="1"></dsfr-data-source>
  <dsfr-data-kpi id="k1" source="s1" value="med:max" label="Médiane nationale"></dsfr-data-kpi>
  <dsfr-data-source id="s2" api-type="opendatasoft" base-url="https://data.education.gouv.fr"
    dataset-id="donnees-ips-ecoles" select="code_departement, median(ips) as med"
    group-by="code_departement" where="rentree_scolaire = '2024-2025'"></dsfr-data-source>
  <dsfr-data-kpi id="k2" source="s2" value="count" label="Départements avec médiane"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
