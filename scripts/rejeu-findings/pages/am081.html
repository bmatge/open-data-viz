<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-081 — libellé de valeur sur une facette</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-081 — la facette affiche-t-elle encore le code ?</h1>
  <!-- dep_code et dep_nom sont deux champs des MEMES lignes. La demande AM-081
       reclamait `value-labels` ; #928 l'a livre en deux grammaires. On rejoue
       les deux, plus la facette nue comme temoin. -->
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="dep_code, dep_nom" where="reg_nom = 'Bretagne'"
    fetch-mode="export" max-records="20000"></dsfr-data-source>
  <h2>1. temoin : facette nue sur le code</h2>
  <dsfr-data-facets id="f1" source="s" fields="dep_code" labels="dep_code:Departement" max-values="10"></dsfr-data-facets>
  <h2>2. champ compagnon</h2>
  <dsfr-data-facets id="f2" source="s" fields="dep_code" labels="dep_code:Departement"
    value-labels="dep_code:dep_nom" max-values="10"></dsfr-data-facets>
  <h2>3. table figee</h2>
  <dsfr-data-facets id="f3" source="s" fields="dep_code" labels="dep_code:Departement"
    value-labels='{"dep_code":{"29":"Finistere","56":"Morbihan"}}' max-values="10"></dsfr-data-facets>
  <h2>4. ce qui part filtrer, en aval de la facette 2</h2>
  <dsfr-data-list id="l2" source="f2" columns="dep_code,dep_nom" page-size="3"></dsfr-data-list>
  <div id="sonde" style="font-family:monospace"></div>
  <script>
    // Relève l'evenement emis par la facette : c'est lui qui porte la valeur diffusee.
    addEventListener('load', () => {
      const f2 = document.getElementById('f2');
      const trace = [];
      for (const type of ['dsfr-data-change', 'dsfr-data-facets-change', 'change', 'dsfr-data-refine'])
        f2.addEventListener(type, (e) => { try { trace.push(type + ' ' + JSON.stringify(e.detail)); } catch { trace.push(type + ' (detail non serialisable)'); } document.getElementById('sonde').textContent = trace.join(' | '); });
    });
  </script>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.33.0/dist/dsfr-data.esm.js"></script>
</body></html>
