<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-081 — libellé de valeur sur une facette</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-081 — la facette affiche le code, jamais le nom</h1>
  <!-- dep_code et dep_nom sont deux champs des MEMES lignes : le libellé existe,
       la facette ne sait pas l'utiliser. Trois formes essayées ci-dessous. -->
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="dep_code, dep_nom" where="reg_nom = 'Bretagne'"
    fetch-mode="export" max-records="20000"></dsfr-data-source>
  <h2>1. facette nue sur le code</h2>
  <dsfr-data-facets id="f1" source="s" fields="dep_code" labels="dep_code:Département" max-values="10"></dsfr-data-facets>
  <h2>2. labels avec une valeur (grammaire détournée)</h2>
  <dsfr-data-facets id="f2" source="s" fields="dep_code" labels="dep_code:Département | 22:Côtes-d'Armor" max-values="10"></dsfr-data-facets>
  <h2>3. value-labels (attribut inventé : ignoré en silence ?)</h2>
  <dsfr-data-facets id="f3" source="s" fields="dep_code" value-labels="dep_code:dep_nom" max-values="10"></dsfr-data-facets>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
