<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-036 : délégation sous des noms renommés</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-036 — <code>normalize(rename) → query → normalize(numeric) → query(group-by)</code> sur Tabular</h1>
  <!-- Ressource de /culture/architecture-contemporaine. Défaut : la dernière query est déléguée
       sous les noms renommés (?d__groupby&ref__count), l'API refuse, la source tombe.
       Attendu juste : aucun appel à tabular-api, calcul côté client sur l'export Parquet. -->
  <dsfr-data-source id="s" api-type="tabular" resource="80b6ac20-41b1-400c-8860-af201ff7dcb6"
    fetch-mode="export" select="Reference_de_la_notice, Date_de_Label"></dsfr-data-source>
  <dsfr-data-normalize id="n1" source="s" rename="Reference_de_la_notice:ref | Date_de_Label:d"></dsfr-data-normalize>
  <dsfr-data-query id="q1" source="n1" where="d:isnotnull"></dsfr-data-query>
  <dsfr-data-normalize id="n2" source="q1" numeric="d"></dsfr-data-normalize>
  <dsfr-data-query id="q2" source="n2" group-by="d" aggregate="ref:count:n"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="q2" value="n:sum" label="Édifices datés (somme des groupes)"></dsfr-data-kpi>
  <dsfr-data-kpi id="kg" source="q2" value="count" label="Années de label distinctes"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
