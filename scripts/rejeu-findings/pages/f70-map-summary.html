<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>#70 — map-summary sur des lignes que la carte ne dessine pas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>#70 — le résumé d'une carte compte-t-il les lignes qu'elle ne dessine pas ?</h1>
  <!-- Neuf lignes reçues, total 201. Quatre sont des collectivités d'outre-mer
       (977, 978, 986, 987 : hors du découpage départemental de DSFR Chart) et
       une est vide : 36 d'écart. Somme des lignes dessinables : 165. -->
  <dsfr-data-source id="s" data='[
    {"dep":"75","n":100},{"dep":"13","n":50},{"dep":"2A","n":10},{"dep":"971","n":5},
    {"dep":"977","n":7},{"dep":"978","n":3},{"dep":"986","n":2},{"dep":"987","n":11},
    {"dep":"","n":13}]'></dsfr-data-source>
  <h2>1. KPI témoin : somme des lignes reçues</h2>
  <dsfr-data-kpi id="k" source="s" value="n:sum" label="Somme reçue"></dsfr-data-kpi>
  <h2>2. carte type="map", map-summary="sum"</h2>
  <dsfr-data-chart id="c-sum" source="s" type="map" code-field="dep" value-field="n"
    map-summary="sum" name="Nombre"></dsfr-data-chart>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
