<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>PG-028 variante B — url-param-map sur le contexte de comparaison</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>Variante B — le contexte de comparaison écrit cmp_reg</h1>
  <dsfr-data-source id="s-ref" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-source id="s-cmp" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="count(*) as n" limit="1" require-where></dsfr-data-source>
  <dsfr-data-context id="ctx-ref" sources="s-ref" url-sync>
    <dsfr-data-context-filter ui="sel-ref" field="reg_nom" apply-to="s-ref"></dsfr-data-context-filter>
  </dsfr-data-context>
  <dsfr-data-context id="ctx-cmp" sources="s-cmp" url-sync url-param-map="cmp_reg:reg_nom">
    <dsfr-data-context-filter ui="sel-cmp" field="reg_nom" apply-to="s-cmp"></dsfr-data-context-filter>
  </dsfr-data-context>
  <label for="sel-ref">Référence</label>
  <select class="fr-select" id="sel-ref"><option value="">—</option><option value="Bretagne">Bretagne</option><option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option><option value="Normandie">Normandie</option></select>
  <label for="sel-cmp">Comparaison</label>
  <select class="fr-select" id="sel-cmp"><option value="">—</option><option value="Bretagne">Bretagne</option><option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option><option value="Normandie">Normandie</option></select>
  <p>référence : <dsfr-data-kpi id="k-ref" source="s-ref" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
  <p>comparaison : <dsfr-data-kpi id="k-cmp" source="s-cmp" value="n:max" format="nombre" idle-message="—"></dsfr-data-kpi></p>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
