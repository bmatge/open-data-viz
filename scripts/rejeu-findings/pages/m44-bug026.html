<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-026 : group_by perdu derrière un normalize</title>
<script src="/assets/cles.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-026 — une source groupée garde-t-elle son <code>group_by</code> derrière un <code>normalize</code> ?</h1>
  <!-- Chaîne de /viz/decp-augmente : source ODS groupée → normalize replace-fields → query group-by,
       SEULE lectrice (le KPI lit la query). Défaut : la requête part sans group_by.
       ?temoin=1 retire le normalize (la query lit la source en direct). -->
  <dsfr-data-source id="s" api-type="opendatasoft"
    base-url="https://data.economie.gouv.fr" dataset-id="decp_augmente" api-key-ref="ods-mef"
    select="procedure, count(*) as n" group-by="procedure" where="procedure is not null"
    fetch-mode="export" max-records="100"></dsfr-data-source>
  <dsfr-data-normalize id="nz" source="s"
    replace-fields="procedure:Appel d offres ouvert:Appel d'offres ouvert | procedure:Appel d offres restreint:Appel d'offres restreint"></dsfr-data-normalize>
  <dsfr-data-query id="q" source="nz" group-by="procedure" aggregate="n:sum:n" order-by="n:desc"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="q" value="n:sum" label="Lignes du jeu (somme des groupes)"></dsfr-data-kpi>
</main>
<script>
  if (new URLSearchParams(location.search).get('temoin')) {
    document.getElementById('nz').remove();
    document.getElementById('q').setAttribute('source', 's');
  }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
