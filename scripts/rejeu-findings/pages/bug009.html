<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BUG-009 — query group-by sur une source partagée</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-009 — la source est partagée par un KPI, une liste et une query d'agrégat</h1>
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://equipements.sports.gouv.fr"
    dataset-id="data-es" select="dep_code, dep_nom, equip_type_name" where="dep_code = '22'"
    fetch-mode="export" max-records="20000"></dsfr-data-source>
  <p>KPI count sur la source : <dsfr-data-kpi id="k" source="s" value="count" format="nombre"></dsfr-data-kpi></p>
  <p>lignes vues par une liste : <dsfr-data-display id="d" source="s" cols="1" pagination="3"><template><span class="l">{{equip_type_name}}</span></template></dsfr-data-display></p>
  <dsfr-data-query id="q" source="s" group-by="equip_type_name" aggregate="dep_code:count:n" order-by="n:desc" limit="5"></dsfr-data-query>
  <p>agrégat : <dsfr-data-kpi id="kq" source="q" value="count" format="nombre"></dsfr-data-kpi></p>
  <!-- La forme TARDIVE (#853) : une seconde query branchée sur la meme source,
       ajoutee au DOM 4 s apres le chargement. -->
  <script>
    setTimeout(() => {
      const q = document.createElement('dsfr-data-query');
      q.id = 'q2'; q.setAttribute('source','s');
      q.setAttribute('group-by','dep_nom'); q.setAttribute('aggregate','dep_code:count:n');
      document.querySelector('main').appendChild(q);
      const k = document.createElement('dsfr-data-kpi');
      k.id='kq2'; k.setAttribute('source','q2'); k.setAttribute('value','count'); k.setAttribute('format','nombre');
      document.querySelector('main').appendChild(k);
    }, 4000);
  </script>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
