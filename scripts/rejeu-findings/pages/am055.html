<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AM-055 — cadrage de map-monde</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>AM-055 — une carte consacrée à l'Europe sur un planisphère</h1>
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://data.economie.gouv.fr"
    dataset-id="apd-france" api-key-ref="ods-mef" group-by="pays_beneficiaire"
    select="count(*) as n" order-by="n:desc" max-records="30"></dsfr-data-source>
  <dsfr-data-chart id="g1" source="s" type="map-monde" label-field="pays_beneficiaire" value-field="n" name="Projets"></dsfr-data-chart>
  <dsfr-data-chart id="g2" source="s" type="map-monde" label-field="pays_beneficiaire" value-field="n" name="Projets"
    zone="europe" bbox="-25,34,45,72" zoom="3"></dsfr-data-chart>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script src="/assets/cles.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.31.0/dist/dsfr-data.esm.js"></script>
</body></html>
