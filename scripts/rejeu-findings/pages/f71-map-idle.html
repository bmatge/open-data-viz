<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>#71 — dsfr-data-map et l'état idle</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>#71 — la couche de carte se vide-t-elle quand la requête repasse en attente ?</h1>
  <!-- Trois points ; une query require-where. Le script de rejeu pose puis retire
       le where de la query : la query repasse en attente (#690). Le display est
       le témoin : il rend son message d'attente. -->
  <dsfr-data-source id="s" data='[
    {"nom":"Paris","t":"a","lat":48.85,"lon":2.35},
    {"nom":"Lyon","t":"a","lat":45.76,"lon":4.83},
    {"nom":"Marseille","t":"b","lat":43.30,"lon":5.37}]'></dsfr-data-source>
  <dsfr-data-query id="q" source="s" require-where></dsfr-data-query>
  <h2>Témoin : display</h2>
  <dsfr-data-display id="d" source="q" idle-message="Choisissez un filtre"><template><p class="ligne">{{nom}}</p></template></dsfr-data-display>
  <h2>Carte</h2>
  <dsfr-data-map id="m" center="46.5,2.5" zoom="5" height="400px">
    <dsfr-data-map-layer id="l" source="q" type="circle" radius="8" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
  </dsfr-data-map>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
