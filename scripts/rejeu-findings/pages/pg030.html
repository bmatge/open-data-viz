<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8"><title>Rejeu PG-030 — « 01 » sur un champ entier</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
  <style> body { padding: 2rem; } </style>
</head>
<body>
<h1>« 01 » comparé à un champ entier</h1>

<!-- `sc_missions` publie `reg` en ENTIER. Deux montages du MÊME filtre :
     A — la source agrège côté serveur (`select=sum(...)`, `limit=1`) : la
         réponse filtrée est VIDE, il n'y a aucune ligne à typer.
     B — la source charge les lignes brutes : le type du champ est observable.
     Question : l'avertissement de #948 se déclenche-t-il dans les deux cas ? -->

<label class="fr-label" for="sel">Région</label>
<select class="fr-select" id="sel">
  <option value="">Toutes régions (aucun filtre au montage)</option>
  <option value="01">01 — Guadeloupe (zéro de tête)</option>
  <option value="75">75 — Nouvelle-Aquitaine (sans zéro)</option>
</select>

<dsfr-data-context id="ctx" sources="a b">
  <dsfr-data-context-filter ui="sel" field="reg" apply-to="a b"></dsfr-data-context-filter>
</dsfr-data-context>

<h2>A — source agrégée côté serveur (aucune ligne brute)</h2>
<dsfr-data-source id="a" api-type="opendatasoft" base-url="https://data.sports.gouv.fr"
  dataset-id="sc_missions" where="annee = '2024'"
  select="sum(nb_missions) as m" limit="1"></dsfr-data-source>
<dsfr-data-kpi id="k-a" source="a" value="m:max" format="nombre" heading="Missions"></dsfr-data-kpi>

<h2>B — source qui charge les lignes brutes</h2>
<dsfr-data-source id="b" api-type="opendatasoft" base-url="https://data.sports.gouv.fr"
  dataset-id="sc_missions" where="annee = '2024'"
  select="reg, nb_missions" max-records="200"></dsfr-data-source>
<dsfr-data-kpi id="k-b" source="b" value="nb_missions:sum" format="nombre" heading="Missions (lignes brutes)"></dsfr-data-kpi>

<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.33.0/dist/dsfr-data.esm.js"></script>
</body>
</html>
