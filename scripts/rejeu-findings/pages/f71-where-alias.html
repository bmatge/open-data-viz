<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>#71 — where de query sur un alias d'agrégat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>#71 / BUG-027 — un where de query sur un alias d'agrégat part-il au portail ?</h1>
  <!-- Source ODS groupée par département, count(ips) as n. La query q, SEULE
       lectrice de s, filtre n >= 500. Une seconde source s2 sur le même jeu ne
       demande rien d'illégal : suit-elle l'abandon de l'export ? -->
  <dsfr-data-source id="s" api-type="opendatasoft" base-url="https://data.education.gouv.fr"
    dataset-id="donnees-ips-ecoles" fetch-mode="export"
    select="code_departement, count(ips) as n" group-by="code_departement"
    where="rentree_scolaire = '2024-2025'"></dsfr-data-source>
  <dsfr-data-query id="q" source="s" where="n:gte:500"></dsfr-data-query>
  <dsfr-data-kpi id="k" source="q" value="count" label="Départements d'au moins 500 écoles avec IPS"></dsfr-data-kpi>
  <dsfr-data-source id="s2" api-type="opendatasoft" base-url="https://data.education.gouv.fr"
    dataset-id="donnees-ips-ecoles" fetch-mode="export"
    select="rentree_scolaire, count(*) as tot" group-by="rentree_scolaire"></dsfr-data-source>
  <dsfr-data-kpi id="k2" source="s2" value="count" label="Rentrées (source voisine)"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
