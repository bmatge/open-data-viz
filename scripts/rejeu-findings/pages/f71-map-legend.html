<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>#71 — map-legend et « Autres valeurs »</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>#71 — peut-on renommer le repli « Autres valeurs » de la légende ?</h1>
  <!-- color-map ne couvre que a et b : la ligne c prend le repli color, que la
       légende nomme « Autres valeurs ». On essaie les noms plausibles d'un
       libellé de repli, sur la couche et sur la légende. -->
  <dsfr-data-source id="s" data='[
    {"nom":"Paris","t":"a","lat":48.85,"lon":2.35},
    {"nom":"Lyon","t":"b","lat":45.76,"lon":4.83},
    {"nom":"Marseille","t":"c","lat":43.30,"lon":5.37}]'></dsfr-data-source>
  <dsfr-data-map id="m" center="46.5,2.5" zoom="5" height="400px">
    <dsfr-data-map-layer id="l" source="s" type="circle" radius="8" lat-field="lat" lon-field="lon"
      color="#929292" color-field="t" color-map="a:#000091,b:#e1000f"
      empty-label="Non renseigné" other-label="Non renseigné" fallback-label="Non renseigné"></dsfr-data-map-layer>
    <dsfr-data-map-legend id="lg" for="l" label="Type"
      empty-label="Non renseigné" other-label="Non renseigné" fallback-label="Non renseigné"></dsfr-data-map-legend>
  </dsfr-data-map>
  <h2>Contournement : recoder en amont et nommer la catégorie dans color-map</h2>
  <!-- Toute valeur hors a|b devient « Non renseigné », qui a sa couleur : le
       repli ne sert plus. Ne tient que si l'ensemble des valeurs est connu. -->
  <dsfr-data-normalize id="n" source="s" compute="t2 = when t = 'a' then 'a' else when t = 'b' then 'b' else 'Non renseigné'"></dsfr-data-normalize>
  <dsfr-data-map id="m2" center="46.5,2.5" zoom="5" height="300px">
    <dsfr-data-map-layer id="l2" source="n" type="circle" radius="8" lat-field="lat" lon-field="lon"
      color="#929292" color-field="t2" color-map="a:#000091,b:#e1000f,Non renseigné:#929292"></dsfr-data-map-layer>
    <dsfr-data-map-legend id="lg2" for="l2" label="Type"></dsfr-data-map-legend>
  </dsfr-data-map>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
