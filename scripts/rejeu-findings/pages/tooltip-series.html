<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <title>Rejeu — infobulle d'un graphique multisérie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
  <style> body { padding: 2rem; } dsfr-data-chart { display: block; max-width: 640px; } </style>
</head>
<body>
<h1>Infobulle d'un graphique multisérie</h1>

<!-- Trois cas, une seule donnée : avec color-map, sans color-map, et en
     `value-fields` (format large) plutôt qu'en `series-field` (format long).
     Question posée : la pastille de l'infobulle suit-elle la couleur tracée,
     et l'infobulle nomme-t-elle la série ? -->
<dsfr-data-source id="src" data='[
  {"annee":"2025","milieu":"Commune rurale","hab":395155},
  {"annee":"2025","milieu":"Commune urbaine","hab":939921},
  {"annee":"2026","milieu":"Commune rurale","hab":13200000},
  {"annee":"2026","milieu":"Commune urbaine","hab":17200000}
]'></dsfr-data-source>

<dsfr-data-source id="large" data='[
  {"annee":"2025","rural":395155,"urbain":939921},
  {"annee":"2026","rural":13200000,"urbain":17200000}
]'></dsfr-data-source>

<h2>A — series-field + color-map</h2>
<dsfr-data-chart id="a" source="src" type="bar" stacked
  label-field="annee" value-field="hab" series-field="milieu"
  color-map="Commune rurale:#00a95f,Commune urbaine:#000091"
  unit-tooltip="habitants"></dsfr-data-chart>

<h2>B — series-field, sans color-map</h2>
<dsfr-data-chart id="b" source="src" type="bar" stacked
  label-field="annee" value-field="hab" series-field="milieu"
  unit-tooltip="habitants"></dsfr-data-chart>

<h2>C — value-fields (format large), sans color-map</h2>
<dsfr-data-chart id="c" source="large" type="bar" stacked
  label-field="annee" value-fields="rural:Commune rurale, urbain:Commune urbaine"
  unit-tooltip="habitants"></dsfr-data-chart>

<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.33.0/dist/dsfr-data.esm.js"></script>
</body>
</html>
