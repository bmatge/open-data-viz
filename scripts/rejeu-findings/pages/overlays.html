<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Overlays + databox, groupe null dans a11y, années numériques</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
</head>
<body>
  <main class="fr-container">
    <!-- 1. reference-lines + targets, avec et sans databox (seule variable) -->
    <dsfr-data-source id="serie" data='[{"mois":"2024-01","cumul":1000},{"mois":"2024-02","cumul":1800},{"mois":"2024-03","cumul":2600},{"mois":"2024-04","cumul":3100}]'></dsfr-data-source>
    <h2>Sans databox</h2>
    <dsfr-data-chart id="g-sans" source="serie" type="line" label-field="mois" value-field="cumul:Cumul" y-min="0"
      reference-lines='[{"axis":"y","value":2000,"label":"Objectif intermédiaire"}]'
      targets='[{"x":"2024-09","value":4000,"label":"Cible septembre"}]'></dsfr-data-chart>
    <h2>Avec databox</h2>
    <dsfr-data-chart id="g-avec" source="serie" type="line" label-field="mois" value-field="cumul:Cumul" y-min="0"
      reference-lines='[{"axis":"y","value":2000,"label":"Objectif intermédiaire"}]'
      targets='[{"x":"2024-09","value":4000,"label":"Cible septembre"}]'
      databox databox-title="Cumul et cible"></dsfr-data-chart>

    <!-- 2. groupe null : empty-label sur le graphique, tableau a11y -->
    <dsfr-data-source id="cats" data='[{"cat":"École","n":10},{"cat":"Collège","n":6},{"cat":null,"n":3}]'></dsfr-data-source>
    <dsfr-data-chart id="g-null" source="cats" type="bar" label-field="cat" value-field="n:Effectif" empty-label="Non renseigné"></dsfr-data-chart>
    <dsfr-data-a11y id="a-null" for="g-null" source="cats" table label-field="cat" value-field="n"></dsfr-data-a11y>

    <!-- 3. années numériques vs chaînes -->
    <dsfr-data-source id="ans-num" data='[{"an":2022,"v":100},{"an":2023,"v":104},{"an":2024,"v":109}]'></dsfr-data-source>
    <dsfr-data-source id="ans-txt" data='[{"an":"2022","v":100},{"an":"2023","v":104},{"an":"2024","v":109}]'></dsfr-data-source>
    <dsfr-data-chart id="g-num" source="ans-num" type="line" label-field="an" value-field="v:Base 100"></dsfr-data-chart>
    <dsfr-data-a11y id="a-num" for="g-num" source="ans-num" table label-field="an" value-field="v"></dsfr-data-a11y>
    <dsfr-data-chart id="g-txt" source="ans-txt" type="line" label-field="an" value-field="v:Base 100"></dsfr-data-chart>
    <dsfr-data-a11y id="a-txt" for="g-txt" source="ans-txt" table label-field="an" value-field="v"></dsfr-data-a11y>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.29.1/dist/dsfr-data.esm.js"></script>
</body>
</html>
