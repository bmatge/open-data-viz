<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>m44 — BUG-038 : min/max sur plus de 125 000 valeurs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
  <h1>BUG-038 — <code>min</code>/<code>max</code> sur N valeurs (<code>?n=200000</code>)</h1>
  <!-- N lignes générées avant le chargement du bundle : x = 1..N (numérique), d = date ISO,
       g = un seul groupe. Attendu juste : x min 1, max N ; d min 2000-01-01.
       Défaut : RangeError « Maximum call stack size exceeded » au-delà de ~125 000 valeurs.
       Une query par colonne et par forme : un échec ne masque pas les autres. -->
  <dsfr-data-source id="s"></dsfr-data-source>
  <dsfr-data-query id="qx" source="s" aggregate="x:min:xmin, x:max:xmax"></dsfr-data-query>
  <dsfr-data-query id="qxg" source="s" group-by="g" aggregate="x:min:xmin, x:max:xmax"></dsfr-data-query>
  <dsfr-data-query id="qd" source="s" aggregate="d:min:dmin, d:max:dmax"></dsfr-data-query>
  <dsfr-data-query id="qs" source="s" aggregate="x:sum:xsum"></dsfr-data-query>
  <dsfr-data-kpi id="kx" source="s" value="x:max" label="KPI x:max (utils/aggregations)"></dsfr-data-kpi>
  <dsfr-data-kpi id="kd" source="s" value="d:max" format="date" label="KPI d:max"></dsfr-data-kpi>
</main>
<script>
  const N = Number(new URLSearchParams(location.search).get('n') || 200000);
  const t0 = Date.UTC(2000, 0, 1);
  const rows = new Array(N);
  for (let i = 0; i < N; i++) rows[i] = { g: 'u', x: i + 1, d: new Date(t0 + (i % 9000) * 86400000).toISOString().slice(0, 10) };
  document.getElementById('s').setAttribute('data', JSON.stringify(rows));
  window.__N = N;
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
