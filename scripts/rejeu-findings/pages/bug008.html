<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BUG-008 — clés hors référentiel sur map-reg / map-aca</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
</head>
<body>
  <main class="fr-container">
    <!-- Régions en code INSEE (pas ISO 3166-2) : 44 Grand Est, 11 IdF, 84 ARA, 01 Guadeloupe, 999 inconnu -->
    <dsfr-data-source id="s-reg" data='[{"reg":"44","v":10},{"reg":"11","v":20},{"reg":"84","v":30},{"reg":"01","v":40},{"reg":"999","v":50}]'></dsfr-data-source>
    <dsfr-data-chart id="c-reg" source="s-reg" type="map-reg" code-field="reg" value-field="v" name="Test régions"></dsfr-data-chart>

    <!-- Académies telles que les jeux les écrivent : accentuées, avec article -->
    <dsfr-data-source id="s-aca" data='[{"aca":"Orléans-Tours","v":10},{"aca":"La Réunion","v":20},{"aca":"Besançon","v":30},{"aca":"Paris","v":40},{"aca":"Polynésie","v":50},{"aca":"Étranger","v":60}]'></dsfr-data-source>
    <dsfr-data-chart id="c-aca" source="s-aca" type="map-aca" code-field="aca" value-field="v" name="Test académies"></dsfr-data-chart>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.29.1/dist/dsfr-data.esm.js"></script>
</body>
</html>
