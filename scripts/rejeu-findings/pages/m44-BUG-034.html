<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BUG-034 — un encart clone la couche entière</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css">
<link rel="stylesheet" href="/assets/site.css"></head>
<body><main class="fr-container">
  <h1>BUG-034 — un encart ne dessine-t-il que les points de son emprise, une fois, à jour ?</h1>
  <!-- Quatre points : 2 en métropole (t=a), 1 à La Réunion (t=b), 1 en Guadeloupe (t=b).
       insets="drom" : 5 encarts. Le runner compte, par carte (hôte et encarts), les lignes
       de la couche et les cercles au DOM, puis coche t=a (2 points de métropole) et recompte. -->
  <dsfr-data-source id="s" data='[
    {"nom":"Paris","t":"a","lat":48.85,"lon":2.35},
    {"nom":"Lyon","t":"a","lat":45.76,"lon":4.83},
    {"nom":"Saint-Denis","t":"b","lat":-20.88,"lon":55.45},
    {"nom":"Pointe-à-Pitre","t":"b","lat":16.24,"lon":-61.53}]'></dsfr-data-source>
  <dsfr-data-facets id="f" source="s" fields="t"></dsfr-data-facets>
  <dsfr-data-map id="m" center="46.5,2.5" zoom="5" height="500px" insets="drom">
    <dsfr-data-map-layer id="l" source="f" type="circle" radius="8" lat-field="lat" lon-field="lon" tooltip-field="nom"></dsfr-data-map-layer>
  </dsfr-data-map>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
