<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BUG-037 — élément répété dans une cellule tableau</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>BUG-037 — un élément répété dans une cellule tableau compte-t-il deux fois ?</h1>
  <!-- Deux lignes portent « Patrimoine » (l'une deux fois dans sa cellule), une « Musée ».
       Attendu honnête : « Patrimoine 2 ». Le runner lit le compteur, coche, compte les lignes. -->
  <dsfr-data-source id="s" data='[
    {"nom":"A","d":["Patrimoine","Patrimoine"]},
    {"nom":"B","d":["Patrimoine"]},
    {"nom":"C","d":["Musée"]}]'></dsfr-data-source>
  <dsfr-data-facets id="f" source="s" fields="d"></dsfr-data-facets>
  <dsfr-data-display id="d" source="f"><template><p class="ligne">{{nom}}</p></template></dsfr-data-display>
  <h2>query explode</h2>
  <dsfr-data-query id="q" source="s" group-by="d" explode="d" aggregate="nom:count:n"></dsfr-data-query>
  <dsfr-data-display id="dq" source="q"><template><p class="groupe">{{d}}={{n}}</p></template></dsfr-data-display>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
