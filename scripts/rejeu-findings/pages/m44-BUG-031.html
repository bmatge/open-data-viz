<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>BUG-031 — virgule dans une valeur de facette et URL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css"></head>
<body><main class="fr-container">
  <h1>BUG-031 — une valeur de facette à virgule survit-elle au rechargement de l'URL ?</h1>
  <!-- Cinq lignes : 2 en « 1,5 à 2 parcours », 3 en « 2 à 3 parcours ». Facette autonome,
       url-params (lecture) + url-sync (écriture). Le runner coche la valeur à virgule,
       relève l'URL, recharge, et compte cases cochées et lignes rendues. -->
  <dsfr-data-source id="s" data='[
    {"nom":"A","intensite":"1,5 à 2 parcours"},
    {"nom":"B","intensite":"1,5 à 2 parcours"},
    {"nom":"C","intensite":"2 à 3 parcours"},
    {"nom":"D","intensite":"2 à 3 parcours"},
    {"nom":"E","intensite":"2 à 3 parcours"}]'></dsfr-data-source>
  <dsfr-data-facets id="f" source="s" fields="intensite" url-params url-sync></dsfr-data-facets>
  <dsfr-data-display id="d" source="f"><template><p class="ligne">{{nom}}</p></template></dsfr-data-display>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
