<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>BUG-015 — jointure require-where, ordre mauvais</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css"></head>
<body><main class="fr-container">
    <dsfr-data-source id="t-reg" api-type="opendatasoft" base-url="https://data.sports.gouv.fr" dataset-id="portrait_territoires_base" group-by="reg_code, reg_nom" select="count(*) as n" max-records="30" require-where></dsfr-data-source>
    <dsfr-data-source id="s-prat" api-type="opendatasoft" base-url="https://data.sports.gouv.fr" dataset-id="prat_reg_sexe" max-records="50"></dsfr-data-source>
    <dsfr-data-context id="ctx" sources="t-reg">
      <dsfr-data-context-filter ui="sel-reg" field="reg_code" apply-to="t-reg"></dsfr-data-context-filter>
    </dsfr-data-context>
    <select class="fr-select" id="sel-reg"><option value="">France entière</option><option value="53">Bretagne</option><option value="75">Nouvelle-Aquitaine</option></select>
    <dsfr-data-join id="j-prat" left="t-reg" right="s-prat" on="reg_code" type="inner"></dsfr-data-join>
    <p>KPI : <dsfr-data-kpi id="k" source="j-prat" value="part_prat_reg:max" format="nombre" unit="%" idle-message="Choisissez une région"></dsfr-data-kpi></p>
    <dsfr-data-display id="d" source="j-prat" cols="1" idle-message="Choisissez une région (display)"><template><p class="ligne">{{reg_nom}} {{part_prat_reg}}</p></template></dsfr-data-display>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.29.1/dist/dsfr-data.esm.js"></script>
</body></html>
