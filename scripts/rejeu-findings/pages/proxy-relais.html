<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>proxy-url — un portail Opendatasoft est-il relayé, et le relais est-il cachable ?</title></head>
<body><main>
  <h1>proxy-url — un portail Opendatasoft est-il relayé, et le relais est-il cachable ?</h1>
  <!-- A : adaptateur Opendatasoft + proxy-url. Attendu si le relais marchait : une
       requête vers /relais. -->
  <dsfr-data-source id="a" api-type="opendatasoft" base-url="https://data.economie.gouv.fr"
    dataset-id="fermeture-reseau-cuivre" select="code_insee" limit="1"
    proxy-url="/relais"></dsfr-data-source>
  <!-- B : la même, avec use-proxy en plus. -->
  <dsfr-data-source id="b" api-type="opendatasoft" base-url="https://data.economie.gouv.fr"
    dataset-id="fermeture-reseau-cuivre" select="code_insee" limit="2"
    use-proxy proxy-url="/relais"></dsfr-data-source>
  <!-- C et D : mode URL générique + use-proxy, deux cibles différentes. Si la cible
       part dans un en-tête, les deux requêtes ont la MÊME URL : un cache indexé
       par URL ne peut pas les distinguer. -->
  <dsfr-data-source id="c" url="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/fermeture-reseau-cuivre/records?limit=3"
    transform="results" use-proxy proxy-url="/relais"></dsfr-data-source>
  <dsfr-data-source id="d" url="https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/donnees-ips-colleges/records?limit=4"
    transform="results" use-proxy proxy-url="/relais"></dsfr-data-source>
  <dsfr-data-kpi source="a" value="count"></dsfr-data-kpi><dsfr-data-kpi source="b" value="count"></dsfr-data-kpi>
  <dsfr-data-kpi source="c" value="count"></dsfr-data-kpi><dsfr-data-kpi source="d" value="count"></dsfr-data-kpi>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.42.0/dist/dsfr-data.esm.js"></script>
</body></html>
