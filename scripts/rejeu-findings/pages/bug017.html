<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BUG-017 — fullscreen + insets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css">
</head>
<body>
  <main class="fr-container">
    <dsfr-data-source id="pts" data='[{"nom":"Paris","lat":48.85,"lon":2.35},{"nom":"Fort-de-France","lat":14.6,"lon":-61.07},{"nom":"Saint-Denis","lat":-20.88,"lon":55.45}]'></dsfr-data-source>
    <h2>Sans encarts</h2>
    <dsfr-data-map id="m-sans" height="400px" fullscreen name="Sans encarts">
      <dsfr-data-map-layer source="pts" lat-field="lat" lon-field="lon" label="Points"></dsfr-data-map-layer>
    </dsfr-data-map>
    <h2>Avec encarts</h2>
    <dsfr-data-map id="m-avec" height="400px" fullscreen insets="drom" name="Avec encarts">
      <dsfr-data-map-layer source="pts" lat-field="lat" lon-field="lon" label="Points"></dsfr-data-map-layer>
    </dsfr-data-map>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/dsfr-data@0.29.1/dist/dsfr-data.esm.js"></script>
</body>
</html>
